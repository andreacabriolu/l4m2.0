                    {% for mod in mods %}
                    <option value="{{mod}}">{{mod}}</option>
                    {% endfor %}
                </select>
                <label for="mods">Modulo</label>
            </div>
            <div class="form-floating cap">
                <select class="form-select form-select-lg mb-3 form-select-custom form-select-player" id="captain">
                    {% for pl in players_all %}
                        <option value="{{pl}}" data-id="{{pl.Player__id}}">[{{pl.Player__Role}}] {{pl.Player__Surname}} ({{pl.Player__RealTeam__Name}})</option>
                    {% endfor %}
                    <option value="" selected></option>
                </select>
                <label for="captain">Capitano</label>
            </div>
            <div class="switches">
                <div class="form-check form-switch form-floating form-switch-md">
                    <input class="form-check-input" type="checkbox" role="switch" id="hideLineupSwitch">

                <div class="form-check form-switch form-floating form-switch-md">

            </div>

                    RESET TITOLARI
