{% load static %}

<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <script src="{% static 'l4m/js/color-modes.js' %}"></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %} {% endblock %}</title>

    {% block links %}
    {% endblock %}

    {% block scripts %}
    {% endblock %}

    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="shortcut icon" type="image/png" href="{% static 'l4m/images/favicon.ico' %}">
    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/navbar-bottom/">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
    <link href="{% static 'l4m/css/base.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<div class="container-fluid topbar">
    <nav class="navbar fixed-top navbar-expand-sm navbar-dark bg-dark">
        <div class="side-buttons">
            <button type="button" class="btn btn-primary btn-lg btn-top" id="myAuctionBtn">LA MIA ASTA</button>
            <button type="button" class="btn btn-primary btn-lg btn-top" id="allAuctionsBtn">TUTTE LE
                ASTE</button>
        </div>
    </nav>
</div>


<body>

    {% block content %}
    {% endblock %}

</body>

</html>
